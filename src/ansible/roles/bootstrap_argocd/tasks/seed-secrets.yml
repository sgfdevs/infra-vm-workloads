---
- name: Seed only absent SeaweedFS credentials
  ansible.builtin.include_tasks: seed-secret.yml
  loop:
    - namespace: seaweedfs
      name: seaweedfs-s3-admin
      labels:
        app.kubernetes.io/part-of: seaweedfs
      parameters:
        access_key: "{{ ssm_seaweedfs_s3_admin_access_key_path }}"
        secret_key: "{{ ssm_seaweedfs_s3_admin_secret_key_path }}"
    - namespace: seaweedfs
      name: seaweedfs-s3-observability
      labels:
        app.kubernetes.io/part-of: seaweedfs
      parameters:
        access_key: "{{ ssm_seaweedfs_s3_obs_access_key_path }}"
        secret_key: "{{ ssm_seaweedfs_s3_obs_secret_key_path }}"
    - namespace: observability
      name: seaweedfs-s3-observability
      labels:
        app.kubernetes.io/part-of: seaweedfs
      parameters:
        AWS_ACCESS_KEY_ID: "{{ ssm_seaweedfs_s3_obs_access_key_path }}"
        AWS_SECRET_ACCESS_KEY: "{{ ssm_seaweedfs_s3_obs_secret_key_path }}"
  loop_control:
    loop_var: bootstrap_argocd_seed
    label: "{{ bootstrap_argocd_seed.namespace }}/{{ bootstrap_argocd_seed.name }}"
  run_once: true
