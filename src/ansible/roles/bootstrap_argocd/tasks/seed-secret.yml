---
- name: Seed missing Secret without changing an existing object
  run_once: true
  no_log: true
  diff: false
  block:
    - name: Reset transient seed data
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_values: {}
        _bootstrap_argocd_seed_sts: {}
        _bootstrap_argocd_seed_error: "Cannot read Secret {{ bootstrap_argocd_seed.namespace }}/{{ bootstrap_argocd_seed.name }}"

    - name: Read existing Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secret
          - "{{ bootstrap_argocd_seed.name }}"
          - "--namespace={{ bootstrap_argocd_seed.namespace }}"
          - --ignore-not-found
          - -o
          - json
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: _bootstrap_argocd_seed_read
      changed_when: false

    - name: Validate existing Secret
      ansible.builtin.include_tasks:
        file: validate-seed-secret.yml
        apply:
          no_log: true
          diff: false
          run_once: true
      vars:
        bootstrap_argocd_seed_response: "{{ _bootstrap_argocd_seed_read.stdout }}"
      when: _bootstrap_argocd_seed_read.stdout | length > 0

    - name: Create only an absent Secret
      when: _bootstrap_argocd_seed_read.stdout | length == 0
      block:
        - name: Set sanitized lookup failure
          ansible.builtin.set_fact:
            _bootstrap_argocd_seed_error: "Cannot retrieve parameters for {{ bootstrap_argocd_seed.namespace }}/{{ bootstrap_argocd_seed.name }}"

        - name: Assume the dedicated LZ reader only for an absent SGF tailnet Secret
          amazon.aws.sts_assume_role:
            role_arn: "arn:aws:iam::{{ bootstrap_argocd_lz_aws_account_id }}:role/SGFDevsBootstrapTailnetParameterReader"
            role_session_name: sgfdevs-bootstrap-tailnet
            duration_seconds: 900
            region: us-east-2
          delegate_to: localhost
          become: false
          register: _bootstrap_argocd_seed_sts
          when: bootstrap_argocd_seed.cross_account | default(false)

        - name: Fetch seed parameters individually
          ansible.builtin.include_tasks:
            file: fetch-seed-parameter.yml
            apply:
              no_log: true
              diff: false
              run_once: true
          loop: "{{ bootstrap_argocd_seed.parameters | dict2items }}"
          loop_control:
            loop_var: bootstrap_argocd_seed_parameter
            label: "{{ bootstrap_argocd_seed_parameter.key }}"

        - name: Set sanitized create failure
          ansible.builtin.set_fact:
            _bootstrap_argocd_seed_error: "Cannot create Secret {{ bootstrap_argocd_seed.namespace }}/{{ bootstrap_argocd_seed.name }}"

        - name: Create seed through stdin
          ansible.builtin.command:
            argv: [kubectl, create, -f, "-"]
            stdin: "{{ bootstrap_argocd_seed | bootstrap_secret_manifest(_bootstrap_argocd_seed_values) | to_json }}"
            stdin_add_newline: false
          environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          register: _bootstrap_argocd_seed_create
          failed_when: false
          changed_when: _bootstrap_argocd_seed_create.rc == 0

        - name: Reject creation errors other than a competing creator
          ansible.builtin.assert:
            that:
              - _bootstrap_argocd_seed_create.rc == 0 or 'AlreadyExists' in (_bootstrap_argocd_seed_create.stderr | default(''))
            quiet: true

        - name: Validate the competing Secret without writing it
          when: _bootstrap_argocd_seed_create.rc != 0
          block:
            - name: Read competing Secret
              ansible.builtin.command:
                argv:
                  - kubectl
                  - get
                  - secret
                  - "{{ bootstrap_argocd_seed.name }}"
                  - "--namespace={{ bootstrap_argocd_seed.namespace }}"
                  - -o
                  - json
              environment:
                KUBECONFIG: /etc/rancher/k3s/k3s.yaml
              register: _bootstrap_argocd_seed_winner
              changed_when: false

            - name: Validate competing Secret
              ansible.builtin.include_tasks:
                file: validate-seed-secret.yml
                apply:
                  no_log: true
                  diff: false
                  run_once: true
              vars:
                bootstrap_argocd_seed_response: "{{ _bootstrap_argocd_seed_winner.stdout }}"
  rescue:
    - name: Report only seed identity and safe failure category
      ansible.builtin.fail:
        msg: "{{ _bootstrap_argocd_seed_error }}"
      no_log: false
  always:
    - name: Discard transient Secret values and session credentials
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_values: {}
        _bootstrap_argocd_seed_sts: {}
        _bootstrap_argocd_seed_read: {}
        _bootstrap_argocd_seed_create: {}
        _bootstrap_argocd_seed_winner: {}
        ansible_failed_result: {} # noqa: var-naming[no-role-prefix]
