---
- name: Find missing or empty decoded keys
  ansible.builtin.set_fact:
    _bootstrap_argocd_seed_missing: >-
      {{ bootstrap_argocd_seed_response | bootstrap_secret_missing_keys(bootstrap_argocd_seed.parameters.keys() | list) }}

- name: Set sanitized incomplete Secret failure
  ansible.builtin.set_fact:
    _bootstrap_argocd_seed_error: >-
      Incomplete Secret {{ bootstrap_argocd_seed.namespace }}/{{ bootstrap_argocd_seed.name }}.
      Missing or empty keys: {{ _bootstrap_argocd_seed_missing | join(', ') }}. Repair deliberately; bootstrap will not overwrite it.
  when: _bootstrap_argocd_seed_missing | length > 0

- name: Reject incomplete Secret without modifying it
  ansible.builtin.assert:
    that: _bootstrap_argocd_seed_missing | length == 0
    quiet: true
