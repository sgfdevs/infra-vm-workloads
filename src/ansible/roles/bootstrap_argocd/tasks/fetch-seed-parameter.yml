---
- name: Read one workload parameter on the controller
  ansible.builtin.set_fact:
    _bootstrap_argocd_seed_values: >-
      {{ _bootstrap_argocd_seed_values | combine({bootstrap_argocd_seed_parameter.key:
         lookup('amazon.aws.aws_ssm', bootstrap_argocd_seed_parameter.value,
                region='us-east-2', decrypt=true, on_missing='error', on_denied='error')}) }}
  when: not (bootstrap_argocd_seed.cross_account | default(false))

- name: Read the SGF tailnet parameter with the short-lived LZ session on the controller
  ansible.builtin.set_fact:
    _bootstrap_argocd_seed_values: >-
      {{ _bootstrap_argocd_seed_values | combine({bootstrap_argocd_seed_parameter.key:
         lookup('amazon.aws.aws_ssm', bootstrap_argocd_seed_parameter.value,
                region='us-east-2', decrypt=true, on_missing='error', on_denied='error',
                access_key=_bootstrap_argocd_seed_sts.sts_creds.access_key,
                secret_key=_bootstrap_argocd_seed_sts.sts_creds.secret_key,
                session_token=_bootstrap_argocd_seed_sts.sts_creds.session_token)}) }}
  when: bootstrap_argocd_seed.cross_account | default(false)
