---
- name: Seed the static AWS credential Secret
  no_log: true
  diff: false
  run_once: true
  vars:
    ansible_pipelining: true
  block:
    - name: Read the bundled AWS credentials once
      ansible.builtin.set_fact:
        _bootstrap_argocd_aws_credentials: >-
          {{ lookup('amazon.aws.ssm_parameter', bootstrap_argocd_aws_credentials_parameter,
                    region='us-east-2', decrypt=true, on_denied='error', on_missing='error') | from_json }}

    - name: Require both credential fields before writing the Secret
      ansible.builtin.assert:
        that:
          - _bootstrap_argocd_aws_credentials is mapping
          - _bootstrap_argocd_aws_credentials.keys() | sort == ['access-key-id', 'secret-access-key']
          - _bootstrap_argocd_aws_credentials['access-key-id'] is string
          - _bootstrap_argocd_aws_credentials['secret-access-key'] is string
          - _bootstrap_argocd_aws_credentials['access-key-id'] | length > 0
          - _bootstrap_argocd_aws_credentials['secret-access-key'] | length > 0
        quiet: true

    # Ansible owns this Secret's credential fields, including after key rotation.
    # Server-side apply avoids storing credentials in a last-applied annotation.
    - name: Apply only the AWS credential Secret through stdin
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --server-side
          - --field-manager=bootstrap-aws-credentials
          - --force-conflicts
          - -f
          - "-"
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: bootstrap-aws-credentials
            namespace: kube-system
          type: Opaque
          data:
            access-key-id: {{ _bootstrap_argocd_aws_credentials['access-key-id'] | b64encode | to_json }}
            secret-access-key: {{ _bootstrap_argocd_aws_credentials['secret-access-key'] | b64encode | to_json }}
        stdin_add_newline: false
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
  always:
    - name: Discard the credential bundle
      ansible.builtin.set_fact:
        _bootstrap_argocd_aws_credentials: {}
