---
# This entrypoint is also imported without prepare.yml by the seed-only playbook.
# amazon.aws's lookup logs returned values at verbosity 4, regardless of task no_log.
- name: Reject unsafe controller debug logging before fetching parameters
  ansible.builtin.assert:
    that:
      - ansible_verbosity | int < 4
      - not (lookup('env', 'ANSIBLE_DEBUG') | default('false', true) | bool)
      - not (lookup('ansible.builtin.config', 'DEFAULT_KEEP_REMOTE_FILES') | bool)
    fail_msg: Bootstrap requires verbosity below 4, debug logging disabled and remote module-file retention disabled.
    quiet: true
  run_once: true

- name: Seed only absent static AWS bootstrap credentials
  ansible.builtin.include_tasks: seed-secret.yml
  loop: "{{ bootstrap_argocd_aws_credential_seeds }}"
  loop_control:
    loop_var: bootstrap_argocd_seed
    label: "{{ bootstrap_argocd_seed.namespace }}/{{ bootstrap_argocd_seed.name }}"
  run_once: true
