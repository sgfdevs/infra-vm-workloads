---
- name: Reconcile only the static AWS credential Secret from SSM
  run_once: true
  no_log: true
  diff: false
  vars:
    # Pipe module arguments too; never persist credentials in remote module files.
    ansible_pipelining: true
  block:
    - name: Reset transient credential data
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_values: {}
        _bootstrap_argocd_seed_error: Cannot reconcile AWS bootstrap credentials

    - name: Restrict reconciliation to the AWS credential Secret and safe transport
      ansible.builtin.assert:
        that:
          - ansible_pipelining | bool
          - bootstrap_argocd_seed.namespace == 'kube-system'
          - bootstrap_argocd_seed.name == 'bootstrap-aws-credentials'
          - bootstrap_argocd_seed.parameters.keys() | sort == ['access-key-id', 'secret-access-key']
          - bootstrap_argocd_seed.parameters.values() | unique(case_sensitive=true) | length == 1
        quiet: true

    - name: Set sanitized read failure
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_error: Cannot read AWS bootstrap credential Secret

    - name: Read AWS credential Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secret
          - bootstrap-aws-credentials
          - --namespace=kube-system
          - --ignore-not-found
          - -o
          - json
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: _bootstrap_argocd_credential_read
      changed_when: false

    - name: Set sanitized lookup failure
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_error: Cannot retrieve or validate AWS bootstrap credentials

    - name: Fetch and parse both credential fields from one SSM value
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_values: >-
          {{ lookup('amazon.aws.ssm_parameter', bootstrap_argocd_seed.parameters.values() | first,
                    region='us-east-2', decrypt=true, on_denied='error', on_missing='error') | from_json }}

    - name: Validate the bundled AWS credential fields before writing the Secret
      ansible.builtin.assert:
        that:
          - _bootstrap_argocd_seed_values is mapping
          - _bootstrap_argocd_seed_values.keys() | sort == ['access-key-id', 'secret-access-key']
          - _bootstrap_argocd_seed_values['access-key-id'] is string
          - _bootstrap_argocd_seed_values['secret-access-key'] is string
          - _bootstrap_argocd_seed_values['access-key-id'] | length > 0
          - _bootstrap_argocd_seed_values['secret-access-key'] | length > 0
        quiet: true

    - name: Render current credentials in memory
      ansible.builtin.set_fact:
        _bootstrap_argocd_credential_manifest: "{{ bootstrap_argocd_seed | bootstrap_secret_manifest(_bootstrap_argocd_seed_values) }}"

    - name: Set sanitized write failure
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_error: Cannot reconcile AWS bootstrap credential Secret

    - name: Create an absent AWS credential Secret through stdin
      ansible.builtin.command:
        argv: [kubectl, create, -f, "-"]
        stdin: "{{ _bootstrap_argocd_credential_manifest | to_json }}"
        stdin_add_newline: false
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: _bootstrap_argocd_credential_write
      changed_when: _bootstrap_argocd_credential_write.rc == 0
      when: _bootstrap_argocd_credential_read.stdout | length == 0

    - name: Update existing AWS credentials without replacing the Secret
      when: _bootstrap_argocd_credential_read.stdout | length > 0
      block:
        - name: Build a data-only patch guarded by Secret UID and resource version
          ansible.builtin.set_fact:
            _bootstrap_argocd_credential_patch: >-
              {{ _bootstrap_argocd_credential_read.stdout |
                 bootstrap_aws_credentials_patch(_bootstrap_argocd_credential_manifest) }}

        - name: Patch changed AWS credentials through stdin
          ansible.builtin.command:
            argv:
              - kubectl
              - patch
              - secret
              - bootstrap-aws-credentials
              - --namespace=kube-system
              - --type=merge
              - --patch-file=/dev/stdin
            stdin: "{{ _bootstrap_argocd_credential_patch | to_json }}"
            stdin_add_newline: false
          environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          register: _bootstrap_argocd_credential_write
          changed_when: _bootstrap_argocd_credential_write.rc == 0
          when: _bootstrap_argocd_credential_patch | length > 0
  rescue:
    - name: Report only the safe credential failure category
      ansible.builtin.fail:
        msg: "{{ _bootstrap_argocd_seed_error }}"
      no_log: false
  always:
    - name: Discard transient credential values
      ansible.builtin.set_fact:
        _bootstrap_argocd_seed_values: {}
        _bootstrap_argocd_credential_read: {}
        _bootstrap_argocd_credential_manifest: {}
        _bootstrap_argocd_credential_patch: {}
        _bootstrap_argocd_credential_write: {}
        ansible_failed_result: {} # noqa: var-naming[no-role-prefix]
