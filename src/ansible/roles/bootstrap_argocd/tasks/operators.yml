---
- name: Apply base operators root
  ansible.builtin.include_tasks: apply-root.yml
  vars:
    bootstrap_argocd_root_name: base-operators
    bootstrap_argocd_root_path: src/k8s/bootstrap/operators/base
- name: Wait for base operator CRDs
  ansible.builtin.command: "kubectl wait --for=condition=Established --timeout={{ bootstrap_argocd_poll_timeout }} crd/{{ item }}"
  environment: {KUBECONFIG: /etc/rancher/k3s/k3s.yaml}
  register: bootstrap_argocd_base_crd
  changed_when: false
  failed_when: false
  retries: "{{ bootstrap_argocd_health_retries }}"
  delay: "{{ bootstrap_argocd_health_delay }}"
  until: bootstrap_argocd_base_crd.rc == 0
  loop: "{{ bootstrap_argocd_base_operator_crds }}"
  run_once: true
- name: Wait for base operator workloads
  ansible.builtin.command: >-
    kubectl wait -n {{ item.namespace }} --for=condition=Ready --timeout={{ bootstrap_argocd_poll_timeout }}
    pod --selector={{ item.selector }}
  environment: {KUBECONFIG: /etc/rancher/k3s/k3s.yaml}
  register: bootstrap_argocd_base_workload
  changed_when: false
  failed_when: false
  retries: "{{ bootstrap_argocd_health_retries }}"
  delay: "{{ bootstrap_argocd_health_delay }}"
  until: bootstrap_argocd_base_workload.rc == 0
  loop: "{{ bootstrap_argocd_base_operator_workloads }}"
  loop_control: {label: "{{ item.namespace }}: {{ item.selector }}"}
  run_once: true
- name: Apply dependent operators root
  ansible.builtin.include_tasks: apply-root.yml
  vars:
    bootstrap_argocd_root_name: dependent-operators
    bootstrap_argocd_root_path: src/k8s/bootstrap/operators/dependent
- name: Wait for dependent operator CRDs
  ansible.builtin.command: "kubectl wait --for=condition=Established --timeout={{ bootstrap_argocd_poll_timeout }} crd/{{ item }}"
  environment: {KUBECONFIG: /etc/rancher/k3s/k3s.yaml}
  register: bootstrap_argocd_dependent_crd
  changed_when: false
  failed_when: false
  retries: "{{ bootstrap_argocd_health_retries }}"
  delay: "{{ bootstrap_argocd_health_delay }}"
  until: bootstrap_argocd_dependent_crd.rc == 0
  loop: "{{ bootstrap_argocd_dependent_operator_crds }}"
  run_once: true
- name: Wait for dependent operator workloads
  ansible.builtin.command: >-
    kubectl wait -n {{ item.namespace }} --for=condition=Ready --timeout={{ bootstrap_argocd_poll_timeout }}
    pod --selector={{ item.selector }}
  environment: {KUBECONFIG: /etc/rancher/k3s/k3s.yaml}
  register: bootstrap_argocd_dependent_workload
  changed_when: false
  failed_when: false
  retries: "{{ bootstrap_argocd_health_retries }}"
  delay: "{{ bootstrap_argocd_health_delay }}"
  until: bootstrap_argocd_dependent_workload.rc == 0
  loop: "{{ bootstrap_argocd_dependent_operator_workloads }}"
  loop_control: {label: "{{ item.namespace }}: {{ item.selector }}"}
  run_once: true
