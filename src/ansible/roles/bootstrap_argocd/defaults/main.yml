---
bootstrap_argocd_force_conflicts: false
bootstrap_argocd_poll_timeout: 10s
bootstrap_argocd_health_retries: 120
bootstrap_argocd_health_delay: 10
bootstrap_argocd_required_crds:
  - applications.argoproj.io
  - applicationsets.argoproj.io
  - appprojects.argoproj.io
bootstrap_argocd_required_workloads:
  - statefulset/argocd-application-controller
  - deployment/argocd-applicationset-controller
  - deployment/argocd-repo-server
  - deployment/argocd-server
  - deployment/argocd-redis-ha-haproxy
  - statefulset/argocd-redis-ha-server
bootstrap_argocd_base_operator_crds:
  - certificates.cert-manager.io
  - clusterissuers.cert-manager.io
  - externalsecrets.external-secrets.io
  - secretstores.external-secrets.io
  - clustersecretstores.external-secrets.io
  - clusters.postgresql.cnpg.io
  - prometheuses.monitoring.coreos.com
  - servicemonitors.monitoring.coreos.com
  - prebackuppods.k8up.io
  - schedules.k8up.io
  - volumes.longhorn.io
  - clusters.apps.kubeblocks.io
bootstrap_argocd_base_operator_workloads:
  - namespace: cert-manager
    selector: app.kubernetes.io/instance=cert-manager
  - namespace: cnpg-system
    selector: app.kubernetes.io/instance=cnpg-operator
  - namespace: external-secrets
    selector: app.kubernetes.io/instance=external-secrets
  - namespace: longhorn-system
    selector: app.kubernetes.io/instance=longhorn
  - namespace: k8up
    selector: app.kubernetes.io/name=k8up
bootstrap_argocd_dependent_operator_crds:
  - databases.kinda.rocks
  - instrumentations.opentelemetry.io
  - opentelemetrycollectors.opentelemetry.io
bootstrap_argocd_dependent_operator_workloads:
  - namespace: db-operator
    selector: app.kubernetes.io/instance=db-operator
  - namespace: kb-system
    selector: app.kubernetes.io/instance=kubeblocks
  - namespace: observability
    selector: app.kubernetes.io/instance=otel-operator
bootstrap_argocd_foundation_resources:
  - resource: clusterissuer/letsencrypt-prod
    condition: Ready

# These are missing-only seeds, not a rotation or drift-repair policy.
bootstrap_argocd_ingress_seeds:
  - namespace: kube-system
    name: cloudflared-sgfdevs-token
    parameters:
      token: /vm-workloads/sgfdevs/infra-vm-workloads/cloudflare-sgfdevs-tunnel-token
  - namespace: kube-system
    name: cloudflared-opensgf-token
    parameters:
      token: /vm-workloads/sgfdevs/infra-vm-workloads/cloudflare-opensgf-tunnel-token
  - namespace: kube-system
    name: traefik-tailnet-auth
    cross_account: true
    parameters:
      authkey: /homelab/headscale/pods/sgfdevs/ingress-gateway-auth-key
  - namespace: kube-system
    name: crowdsec-bouncer-key
    parameters:
      BOUNCER_KEY_traefik: /vm-workloads/sgfdevs/infra-vm-workloads/crowdsec-traefik-bouncer-key
bootstrap_argocd_aws_resources:
  - resource: clustersecretstore/argo-workflows-k8s
    condition: Ready
  - resource: clustersecretstore/argocd-k8s
    condition: Ready
  - resource: clustersecretstore/aws-ssm
    condition: Ready
  - resource: clustersecretstore/dex-k8s
    condition: Ready
  - resource: clustersecretstore/glitchtip-k8s
    condition: Ready
  - resource: clustersecretstore/grafana-k8s
    condition: Ready
  - resource: clustersecretstore/oauth2-proxy-k8s
    condition: Ready
  - resource: externalsecret/argo-workflows-secrets
    namespace: external-secrets
    condition: Ready
  - resource: externalsecret/argocd-secrets
    namespace: external-secrets
    condition: Ready
  - resource: externalsecret/dex-secrets
    namespace: external-secrets
    condition: Ready
  - resource: externalsecret/glitchtip-secrets
    namespace: external-secrets
    condition: Ready
  - resource: externalsecret/grafana-secrets
    namespace: external-secrets
    condition: Ready
  - resource: externalsecret/oauth2-proxy-secrets
    namespace: external-secrets
    condition: Ready
  - resource: externalsecret/ssm-cache
    namespace: external-secrets
    condition: Ready
  - resource: externalsecret/cloudflared-opensgf-token
    namespace: kube-system
    condition: Ready
  - resource: externalsecret/cloudflared-sgfdevs-token
    namespace: kube-system
    condition: Ready
  - resource: externalsecret/crowdsec-bouncer-key
    namespace: kube-system
    condition: Ready
  - resource: externalsecret/traefik-tailnet-auth
    namespace: kube-system
    condition: Ready
  - resource: secretstore/cache-k8s
    namespace: external-secrets
    condition: Ready
  - resource: secretstore/lz-headscale
    namespace: kube-system
    condition: Ready
bootstrap_argocd_issuer_operation_annotation: infra.sgf.dev/issuer-operation-gate
