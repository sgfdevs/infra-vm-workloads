---
- name: Refresh local kubeconfig
  hosts: k3s_servers[0]
  become: true
  gather_facts: false
  vars:
    kubeconfig_context: sgfdevs-k3s
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    kubeconfig_staged_path: "{{ kubeconfig_path }}.new"
  tasks:
    - name: Fetch kubeconfig from first server
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_staged_path }}"
        flat: true

    - name: Set reachable Kubernetes API endpoint
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_staged_path }}"
          - config
          - set-cluster
          - default
          - "--server=https://{{ ansible_host | default(inventory_hostname) }}:6443"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Rename kubeconfig entries
      ansible.builtin.replace:
        path: "{{ kubeconfig_staged_path }}"
        regexp: default
        replace: "{{ kubeconfig_context }}"
      delegate_to: localhost
      become: false

    - name: Merge kubeconfig
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        KUBECONFIG="{{ kubeconfig_staged_path }}:{{ kubeconfig_path }}" kubectl config view --flatten > "{{ kubeconfig_path }}.merged"
        mv "{{ kubeconfig_path }}.merged" "{{ kubeconfig_path }}"
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Remove staged kubeconfig
      ansible.builtin.file:
        path: "{{ kubeconfig_staged_path }}"
        state: absent
      delegate_to: localhost
      become: false
