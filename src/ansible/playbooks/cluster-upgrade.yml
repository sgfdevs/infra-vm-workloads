---
- name: Upgrade K3s server nodes
  hosts: k3s_servers
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    server_group: k3s_servers
    agent_group: k3s_agents
    api_endpoint: "{{ hostvars[groups[server_group][0]].ansible_host | default(groups[server_group][0]) }}"
    token: "{{ k3s_upgrade_token.content | b64decode | trim }}"
  pre_tasks:
    - name: Read the existing server token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: k3s_upgrade_token
      no_log: true
  roles:
    - role: k3s.orchestration.k3s_upgrade
