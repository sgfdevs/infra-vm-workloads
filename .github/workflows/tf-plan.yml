name: CI (PR)

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.changed-files.outputs.ansible_any_changed }}
      terraform: ${{ steps.changed-files.outputs.terraform_any_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect relevant changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            ansible:
              - src/ansible/**
              - .github/workflows/tf-plan.yml
            terraform:
              - src/tf/**
              - .github/workflows/tf-plan.yml

  terraform-validate:
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    uses: glitchedmob/infra-gha/.github/workflows/tf-validate.yml@v0.7.4
    with:
      init-backend: false
    secrets:
      envrc_content: |
        export TF_VAR_proxmox_endpoint="${{ secrets.TF_VAR_proxmox_endpoint }}"
        export TF_VAR_proxmox_api_token="${{ secrets.TF_VAR_proxmox_api_token }}"
        export TF_VAR_b2_application_key_id="${{ secrets.TF_VAR_b2_application_key_id }}"
        export TF_VAR_b2_application_key="${{ secrets.TF_VAR_b2_application_key }}"
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  terraform-plan:
    needs:
      - changes
      - terraform-validate
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    uses: glitchedmob/infra-gha/.github/workflows/tf-plan-apply.yml@v0.7.4
    with:
      plan-only: true
      headscale-login-server: https://headscale.levizitting.com
    secrets:
      envrc_content: |
        export TF_VAR_proxmox_endpoint="${{ secrets.TF_VAR_proxmox_endpoint }}"
        export TF_VAR_proxmox_api_token="${{ secrets.TF_VAR_proxmox_api_token }}"
        export TF_VAR_b2_application_key_id="${{ secrets.TF_VAR_b2_application_key_id }}"
        export TF_VAR_b2_application_key="${{ secrets.TF_VAR_b2_application_key }}"
      headscale_auth_key: ${{ secrets.HEADSCALE_AUTH_KEY }}
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
      output_encryption_key: ${{ secrets.OUTPUT_ENCRYPTION_KEY }}

  ansible-lint:
    needs: changes
    if: ${{ needs.changes.outputs.ansible == 'true' }}
    uses: glitchedmob/infra-gha/.github/workflows/ansible-lint.yml@v0.7.4
    with:
      working-directory: src/ansible

  result:
    name: CI checks
    if: ${{ always() }}
    needs:
      - changes
      - terraform-validate
      - terraform-plan
      - ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: terraform-validate, terraform-plan, ansible-lint
          jobs: ${{ toJSON(needs) }}
