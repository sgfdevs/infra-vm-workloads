name: Ansible Manual

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: Playbook filename under src/ansible/playbooks/
        required: true
        type: choice
        options:
          - base-os-updates.yml
          - cluster-bootstrap.yml
          - argocd-bootstrap.yml
      initialize-terraform:
        description: Initialize Terraform first
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  bootstrap-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the existing workflow credential initialization for bootstrap
        env:
          PLAYBOOK: ${{ inputs.playbook }}
          INITIALIZE_TERRAFORM: ${{ inputs.initialize-terraform }}
        run: |
          case "$PLAYBOOK" in
            argocd-bootstrap.yml|cluster-bootstrap.yml)
              if [ "$INITIALIZE_TERRAFORM" != true ] || [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "Bootstrap requires main and initialize-terraform=true for workflow AWS credentials."
                exit 1
              fi
              ;;
          esac

  run:
    needs: bootstrap-inputs
    uses: glitchedmob/infra-gha/.github/workflows/ansible-run.yml@v0.7.4
    with:
      working-directory: src/ansible
      initialize-terraform: ${{ inputs.initialize-terraform }}
      terraform-working-directory: src/tf
      playbook: ${{ inputs.playbook }}
      headscale-login-server: https://headscale.levizitting.com
    secrets:
      envrc_content: |
        export TF_VAR_proxmox_endpoint="${{ secrets.TF_VAR_proxmox_endpoint }}"
        export TF_VAR_proxmox_api_token="${{ secrets.TF_VAR_proxmox_api_token }}"
      headscale_auth_key: ${{ secrets.HEADSCALE_AUTH_KEY }}
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
      output_encryption_key: ${{ secrets.OUTPUT_ENCRYPTION_KEY }}
