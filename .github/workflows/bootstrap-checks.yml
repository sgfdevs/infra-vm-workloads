name: Bootstrap checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4.7"
      - name: Offline bootstrap contracts
        run: |
          python3 -m venv .test-venv
          .test-venv/bin/pip install PyYAML Jinja2
          .test-venv/bin/python -m unittest discover -s tests -v
